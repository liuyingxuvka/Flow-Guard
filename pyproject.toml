[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.68.16"
description = "Model-first workflow checks for AI agents and process preflights."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
flowguard = "flowguard.__main__:main"

[tool.setuptools.packages.find]
# The documented ``flowguard`` compatibility commands (including
# ``scenario-review``) delegate to the maintained executable examples.  Keep
# those example packages in the wheel so a clean console consumer has the
# same command surface as a source checkout.
include = ["flowguard*", "examples*"]

[tool.setuptools.package-data]
flowguard = ["consumer-suite-authority.json", "prompt_bundle_manifest.json"]

[tool.pytest.ini_options]
norecursedirs = ["build", "worktrees"]
